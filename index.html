<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acoustic Transfer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; margin: 0; background-color: #121212; color: #ffffff; }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        button, input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        button { background: #007aff; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        #console { background: #000; padding: 15px; font-family: monospace; font-size: 14px; border-radius: 8px; min-height: 200px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid #333; }
        .header { text-align: center; margin-bottom: 10px; }
        input[type="file"] { padding: 10px; background: #1a1a1a; }
    </style>
    <!-- Load ggwave.js (local file downloaded previously) -->
    <script src="ggwave.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="header">Acoustic Web Client</h2>
        <button id="start-btn">Start Audio (Microphone)</button>
        
        <hr style="border-color: #333; width: 100%;">
        
        <div style="display:flex; flex-direction: column; gap: 10px;">
            <input type="file" id="file-input">
            <input type="text" id="text-input" placeholder="Type a message (optional)...">
            <button id="send-btn" disabled>Send Data</button>
        </div>
        
        <h3>Receive Console</h3>
        <div id="console">Initializing... Waiting for WASM load.</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
